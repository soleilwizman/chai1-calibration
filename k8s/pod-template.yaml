apiVersion: v1
kind: Pod
metadata:
  name: chai-pod-template
spec:
  restartPolicy: Never
  containers:
    - name: chai
      image: python:3.11-slim
      command: ["/bin/sh", "-c", "mkdir -p /workspace/chai_downloads && echo ready"]
      env:
        - name: CHAI_DOWNLOADS_DIR
          value: /workspace/chai_downloads
      volumeMounts:
        - name: chai-downloads
          mountPath: /workspace/chai_downloads
  volumes:
    - name: chai-downloads
      persistentVolumeClaim:
        claimName: chai-downloads-pvc
